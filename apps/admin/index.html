<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Garaj Admin</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The web app's face: it self-hosts Albert Sans through `next/font` under `--font-urbanist`. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <!-- The web app's theme script (lib/settings/theme-script.ts), same storage key: a theme chosen in one app holds in the other. -->
    <script>
      (function () {
        var p = null;
        try {
          p = localStorage.getItem('vehicleos.theme');
        } catch (e) {}
        var t =
          p === 'light' || p === 'dark'
            ? p
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
        var d = document.documentElement;
        d.dataset.theme = t;
        d.style.colorScheme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
